<app-comic-panel [caption]="i18n.dict().auth.resetPassword.caption">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault(); submit()">
    <div>
      <h1 class="font-display text-3xl tracking-wide text-ink">
        {{ i18n.dict().auth.resetPassword.title }}
      </h1>
      <p class="mt-1 text-sm text-ink-soft">{{ i18n.dict().auth.resetPassword.subtitle }}</p>
    </div>

    <app-input-field
      [label]="i18n.dict().auth.resetPassword.newPasswordLabel"
      type="password"
      [placeholder]="i18n.dict().auth.resetPassword.newPasswordPlaceholder"
      autocomplete="new-password"
      [(value)]="password"
    />

    <app-input-field
      [label]="i18n.dict().auth.resetPassword.confirmPasswordLabel"
      type="password"
      [placeholder]="i18n.dict().auth.resetPassword.confirmPasswordPlaceholder"
      autocomplete="new-password"
      [(value)]="confirmPassword"
    />

    @if (formError()) {
      <p class="text-sm font-semibold text-accent-red">{{ formError() }}</p>
    }

    <app-button type="submit" [loading]="submitting()" [disabled]="!formValid()">{{
      i18n.dict().auth.resetPassword.submit
    }}</app-button>
  </form>
</app-comic-panel>
