<app-comic-panel caption="Capítulo final — Nova senha">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault(); submit()">
    <div>
      <h1 class="font-display text-3xl tracking-wide text-ink">Defina uma nova senha</h1>
      <p class="mt-1 text-sm text-ink-soft">Escolha algo forte — e novo, por favor.</p>
    </div>

    <app-input-field
      label="Nova senha"
      type="password"
      placeholder="Mínimo de 8 caracteres"
      autocomplete="new-password"
      [(value)]="password"
    />

    <app-input-field
      label="Confirmar nova senha"
      type="password"
      placeholder="Repita a senha"
      autocomplete="new-password"
      [(value)]="confirmPassword"
    />

    @if (formError()) {
      <p class="text-sm font-semibold text-accent-red">{{ formError() }}</p>
    }

    <app-button type="submit" [loading]="submitting()">Salvar nova senha</app-button>
  </form>
</app-comic-panel>
