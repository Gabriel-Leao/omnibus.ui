<app-comic-panel [caption]="i18n.dict().auth.register.caption">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault(); submit()">
    <div>
      <h1 class="font-display text-3xl tracking-wide text-ink">
        {{ i18n.dict().auth.register.title }}
      </h1>
      <p class="mt-1 text-sm text-ink-soft">{{ i18n.dict().auth.register.subtitle }}</p>
    </div>

    <app-input-field
      [label]="i18n.dict().auth.register.nameLabel"
      [placeholder]="i18n.dict().auth.register.namePlaceholder"
      autocomplete="name"
      [(value)]="name"
    />

    <app-input-field
      [label]="i18n.dict().auth.register.emailLabel"
      type="email"
      [placeholder]="i18n.dict().auth.register.emailPlaceholder"
      autocomplete="email"
      [(value)]="email"
    />

    <app-input-field
      [label]="i18n.dict().auth.register.birthDateLabel"
      type="text"
      inputmode="numeric"
      [placeholder]="i18n.dict().auth.register.birthDatePlaceholder"
      [hint]="i18n.dict().auth.register.birthDateHint"
      [mask]="formatBirthDate"
      [(value)]="birthDateDisplay"
    />

    <app-input-field
      [label]="i18n.dict().auth.register.passwordLabel"
      type="password"
      [placeholder]="i18n.dict().auth.register.passwordPlaceholder"
      autocomplete="new-password"
      [(value)]="password"
    />

    <app-input-field
      [label]="i18n.dict().auth.register.confirmPasswordLabel"
      type="password"
      [placeholder]="i18n.dict().auth.register.confirmPasswordPlaceholder"
      autocomplete="new-password"
      [(value)]="confirmPassword"
    />

    @if (formError()) {
      <p class="text-sm font-semibold text-accent-red">{{ formError() }}</p>
    }

    <app-button type="submit" [loading]="submitting()" [disabled]="!formValid()">{{
      i18n.dict().auth.register.submit
    }}</app-button>

    <p class="text-center text-sm text-ink-soft">
      {{ i18n.dict().auth.register.hasAccount }}
      <a routerLink="/login" class="font-semibold text-ink underline">{{
        i18n.dict().auth.register.loginLink
      }}</a>
    </p>
  </form>
</app-comic-panel>
