<app-comic-panel caption="Recuperar senha">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault(); submit()">
    <div>
      <h1 class="font-display text-3xl tracking-wide text-ink">Esqueceu a senha?</h1>
      <p class="mt-1 text-sm text-ink-soft">
        Digite seu e-mail e mandamos um código de verificação.
      </p>
    </div>

    <app-input-field
      label="E-mail"
      type="email"
      placeholder="voce@email.com"
      autocomplete="email"
      [(value)]="email"
    />

    @if (formError()) {
      <p class="text-sm font-semibold text-accent-red">{{ formError() }}</p>
    }

    <app-button type="submit" [loading]="submitting()">Enviar código</app-button>

    <p class="text-center text-sm text-ink-soft">
      Lembrou a senha?
      <a routerLink="/login" class="font-semibold text-ink underline">Voltar para o login</a>
    </p>
  </form>
</app-comic-panel>
