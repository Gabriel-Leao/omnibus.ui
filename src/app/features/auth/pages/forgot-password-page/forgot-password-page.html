<app-comic-panel [caption]="i18n.dict().auth.forgotPassword.caption">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault(); submit()">
    <div>
      <h1 class="font-display text-3xl tracking-wide text-ink">
        {{ i18n.dict().auth.forgotPassword.title }}
      </h1>
      <p class="mt-1 text-sm text-ink-soft">
        {{ i18n.dict().auth.forgotPassword.subtitle }}
      </p>
    </div>

    <app-input-field
      [label]="i18n.dict().auth.forgotPassword.emailLabel"
      type="email"
      [placeholder]="i18n.dict().auth.forgotPassword.emailPlaceholder"
      autocomplete="email"
      [(value)]="email"
    />

    @if (formError()) {
      <p class="text-sm font-semibold text-accent-red">{{ formError() }}</p>
    }

    <app-button type="submit" [loading]="submitting()" [disabled]="!formValid()">{{
      i18n.dict().auth.forgotPassword.submit
    }}</app-button>

    <p class="text-center text-sm text-ink-soft">
      {{ i18n.dict().auth.forgotPassword.rememberedPassword }}
      <a routerLink="/login" class="font-semibold text-ink underline">{{
        i18n.dict().auth.forgotPassword.backToLoginLink
      }}</a>
    </p>
  </form>
</app-comic-panel>
