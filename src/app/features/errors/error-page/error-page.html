<div
  class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-paper px-6 py-16 text-center"
>
  <div class="bg-halftone absolute inset-0 text-ink/5" aria-hidden="true"></div>

  <div class="absolute top-6 right-6">
    <app-theme-toggle />
  </div>

  <div
    class="comic-burst relative flex h-56 w-56 items-center justify-center bg-accent-yellow sm:h-64 sm:w-64"
  >
    <span class="font-display text-6xl text-ink sm:text-7xl">{{ code() }}</span>
  </div>

  <h1 class="relative mt-8 font-display text-3xl tracking-wide text-ink sm:text-4xl">
    {{ title() }}
  </h1>
  <p class="relative mt-3 max-w-md text-ink-soft">{{ message() }}</p>

  <a
    routerLink="/"
    class="relative mt-8 inline-flex items-center gap-2 rounded-sm border-2 border-ink bg-panel px-5 py-2.5 font-body text-sm font-bold tracking-wide text-ink uppercase shadow-[var(--shadow-comic-sm)] transition-transform active:translate-x-[3px] active:translate-y-[3px] active:shadow-none"
  >
    Voltar para a capa
  </a>
</div>
