@if (open()) {
  <div
    #dialog
    class="fixed inset-0 z-50 flex items-center justify-center bg-ink/60 p-4"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-label]="title()"
    (keydown.escape)="close()"
  >
    <div
      class="relative w-full max-w-sm rounded-sm border-2 border-ink bg-panel px-6 py-7 shadow-[var(--shadow-comic)]"
    >
      <button
        type="button"
        (click)="close()"
        [attr.aria-label]="i18n.dict().modal.close"
        class="absolute top-3 right-3 flex h-7 w-7 items-center justify-center rounded-full border-2 border-ink text-sm font-bold text-ink hover:bg-accent-yellow"
      >
        ✕
      </button>

      <h2 class="pr-8 font-display text-2xl tracking-wide text-ink">{{ title() }}</h2>

      <div class="mt-3 text-sm leading-relaxed text-ink-soft">
        <ng-content />
      </div>
    </div>
  </div>
}
