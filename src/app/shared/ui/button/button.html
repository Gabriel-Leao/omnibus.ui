<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  class="inline-flex w-full items-center justify-center gap-2 rounded-sm border-2 px-5 py-2.5 font-body text-sm font-bold tracking-wide uppercase transition-all duration-100 active:translate-x-[3px] active:translate-y-[3px] active:shadow-none disabled:cursor-not-allowed disabled:opacity-60 disabled:active:translate-x-0 disabled:active:translate-y-0 disabled:active:shadow-[var(--shadow-comic-sm)]"
  [class]="
    variant() === 'primary'
      ? 'border-ink bg-accent-red text-panel shadow-[var(--shadow-comic-sm)]'
      : variant() === 'secondary'
        ? 'border-ink bg-panel text-ink shadow-[var(--shadow-comic-sm)]'
        : 'border-transparent bg-transparent text-ink underline decoration-2 underline-offset-4 shadow-none'
  "
>
  @if (loading()) {
    <span
      class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      aria-hidden="true"
    ></span>
  }
  <ng-content />
</button>
