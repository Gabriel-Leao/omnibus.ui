<div class="flex flex-col gap-1.5">
  <label [for]="id" class="text-xs font-bold tracking-wide text-ink uppercase">
    {{ label() }}
  </label>

  <div class="relative">
    <input
      [id]="id"
      [type]="resolvedType"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [attr.inputmode]="inputmode()"
      [value]="value()"
      (input)="onInput($event)"
      [attr.aria-invalid]="!!error()"
      class="w-full rounded-sm border-2 border-ink bg-panel px-3.5 py-2.5 font-body text-ink placeholder:text-ink-soft focus:ring-3 focus:ring-accent-yellow focus:outline-none"
    />

    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute top-1/2 right-3 -translate-y-1/2 text-ink-soft hover:text-ink"
        [attr.aria-label]="
          passwordVisible()
            ? i18n.dict().inputField.hidePassword
            : i18n.dict().inputField.showPassword
        "
      >
        @if (passwordVisible()) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.4 5.5A9.9 9.9 0 0112 5c5 0 9 4 10 7-.4 1.1-1 2.2-1.9 3.2M6.6 6.7C4.5 8 3 10 2 12c1 3 5 7 10 7 1.3 0 2.6-.3 3.8-.7"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />
          </svg>
        }
      </button>
    }
  </div>

  @if (error()) {
    <p class="flex items-center gap-1.5 text-sm font-semibold text-accent-red">
      <span
        class="flex h-4 w-4 shrink-0 items-center justify-center rounded-full border border-accent-red text-[10px] leading-none"
        >!</span
      >
      {{ error() }}
    </p>
  } @else if (hint()) {
    <p class="text-sm text-ink-soft">{{ hint() }}</p>
  }
</div>
